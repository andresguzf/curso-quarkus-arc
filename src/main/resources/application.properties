# ===== Aplicación =====
quarkus.application.name=2-quarkus-arc
quarkus.http.port=8080

# ===== Packaging =====
quarkus.package.jar.enabled=true
quarkus.package.jar.type=fast-jar

# ===== Dev Mode: Live Coding, Hot Reload y Dev UI (./mvnw quarkus:dev) =====
# Live coding está activo por defecto en dev mode; Dev UI en http://localhost:8080/q/dev-ui
quarkus.live-reload.instrumentation=true
%dev.quarkus.log.console.level=INFO

# ===== OpenAPI / Swagger UI =====
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===== Datos de ejemplo: Customer e Invoice =====
customer.name=Andrés
customer.lastname=Guzmán
invoice.description=Factura de compras de oficina de tecnologias

# Items de la factura (lista indexada)
invoice.detail.items[0].product=Notebook
invoice.detail.items[0].price=899.90
invoice.detail.items[0].quantity=1
invoice.detail.items[1].product=Mouse inalámbrico
invoice.detail.items[1].price=25.50
invoice.detail.items[1].quantity=2
invoice.detail.items[2].product=Teclado mecánico
invoice.detail.items[2].price=79.99
invoice.detail.items[2].quantity=1
